name: MomsGarden CD

on:
  workflow_run:
    workflows: ["MomsGarden CI"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Download Published Artifact
        uses: actions/download-artifact@v4
        with:
          name: MomsGarden-Publish
          path: ./publish
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to IIS
        run: |
          Copy-Item -Path ".\publish\*" `
                    -Destination "C:\inetpub\wwwroot\8-5-26-MomsGarden" `
                    -Recurse -Force