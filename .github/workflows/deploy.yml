name: MomsGarden CD

on:
  workflow_run:
    workflows: ["MomsGarden CI"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Download Published Artifact
        uses: actions/download-artifact@v4
        with:
          name: MomsGarden-Publish
          path: ./publish
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Deploy to IIS
        shell: powershell
        run: |
          Import-Module WebAdministration

          Write-Host "Stopping MomsGarden website..."
          Stop-Website -Name "MomsGarden"

          Write-Host "Stopping MomsGarden application pool..."
          Stop-WebAppPool -Name "MomsGarden"

          Write-Host "Waiting for IIS to release files..."
          Start-Sleep -Seconds 10

          Write-Host "Copying published files..."
          Copy-Item -Path ".\publish\*" `
                    -Destination "C:\inetpub\wwwroot\8-5-26-MomsGarden" `
                    -Recurse -Force

          Write-Host "Starting MomsGarden application pool..."
          Start-WebAppPool -Name "MomsGarden"

          Write-Host "Starting MomsGarden website..."
          Start-Website -Name "MomsGarden"

          Write-Host "Checking IIS status..."
          Get-Website -Name "MomsGarden" |
            Select-Object Name, State, PhysicalPath

          Write-Host "Deployment completed successfully."