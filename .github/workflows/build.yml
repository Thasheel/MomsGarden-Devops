name: MomsGarden CI

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Download source code from repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Install .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Restore NuGet packages
      - name: Restore Packages
        run: dotnet restore MomsGarden.Web.csproj

      # Compile application
      - name: Build Application
        run: dotnet build MomsGarden.Web.csproj --configuration Release --no-restore

      # Create deployment package
      - name: Publish Application
        run: dotnet publish MomsGarden.Web.csproj --configuration Release --no-build --output ./publish

      # Store publish output as GitHub artifact
      - name: Upload Published Files
        uses: actions/upload-artifact@v4
        with:
          name: MomsGarden-Publish
          path: ./publish